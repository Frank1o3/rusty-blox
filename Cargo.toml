[package]
    edition="2024"
    name="rusty-blox"
    version="0.1.0"
    license="BSD-3-Clause"

[features]
    default=["webview"]
    # Kept as a no-op alias for existing build commands. WebView is always built.
    webview=[]

[dependencies]
    gtk4={version="0.11.5", features=["v4_10"]}
    http="1.5.0"
    libc="0.2.191"
    libloading="0.9.1"
    quick-xml="0.42.0"
    ring="0.17.14"
    roblox-logging={path="roblox-runtime/crates/logging"}
    roblox-runtime={path="roblox-runtime"}
    serde={version="1.0.229", features=["derive"]}
    serde_json="1.0.154"
    sha2="0.11.1"
    ureq="3.5.2"
    wayland-backend={version="0.3.17", features=["client_system"]}
    wayland-client="0.31.15"
    webkit6="0.6.1"
    winit="0.30.13"
    zbus="6.2.1"
    zip={version="9.5.1", default-features=false, features=["deflate"]}
    zstd="0.14.4"

[profile.release]
    lto="thin"

[lints.rust]
    unsafe_op_in_unsafe_fn="deny"

[lints.clippy]
    undocumented_unsafe_blocks="warn"
